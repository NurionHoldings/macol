<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마컬 · 인석의 전화응대</title><meta name="theme-color" content="#071622"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
:root{font:16px system-ui;color:#edf5ff;background:#071622}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.panel{background:#12293c;border:1px solid #365776;border-radius:18px;padding:22px;margin:12px 0}label{display:block;margin:14px 0}input,textarea{width:100%;padding:12px;border:1px solid #587794;background:#071622;color:#fff;border-radius:9px;font:inherit}textarea{min-height:90px}button{padding:12px 18px;border:0;border-radius:9px;background:#38b98b;color:#061a1a;font-weight:bold;cursor:pointer;margin:5px}button[disabled]{opacity:.5}.menu button{display:block;width:100%;text-align:left;background:#214763;color:#fff}.menu button.active{background:#38b98b;color:#062224}.muted{color:#aec5d8}.status{padding:10px;border-radius:8px;background:#1d3b55}code{overflow-wrap:anywhere}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>마컬</h1><p class="muted">말하면서 같은 메뉴를 봅니다. 시험용 브라우저 통화이며, 일반 010 전화와 연결되지 않습니다.</p><section class="panel" id="create"><h2>새 통화방 만들기</h2><form id="new"><label>아르카온 템플릿 초안 가져오기<input id="draft" type="file" accept="application/json,.json"></label><label>방 생성 키<input name="key" type="password" required autocomplete="off"></label><label>내 이름<input name="name" value="인석" required maxlength="80"></label><label>소개<textarea name="intro" required maxlength="500">안녕하세요. 인석입니다. 용건을 선택해 남겨주시면 확인하겠습니다.</textarea></label><label>함께 볼 메뉴 (한 줄씩)<textarea name="menus" required>플랫폼 제휴문의&#10;개발문의&#10;이용문의&#10;개인적인 통화</textarea></label><button>통화방 생성</button></form><p id="created"></p></section><div class="grid" id="room" hidden><section class="panel"><h2 id="title"></h2><p id="intro"></p><p class="status" id="status">연결 중</p><div class="menu" id="menus"></div><button id="request_call" hidden>통화 요청</button><button id="approve_call" hidden>통화 허용</button><button id="decline_call" hidden>이번 통화 거절</button><button id="call" disabled>음성 통화 시작</button><button id="hangup" disabled>음성 종료</button><audio id="remote" autoplay playsinline controls></audio></section><section class="panel"><h2 id="current">메뉴</h2><p class="muted">상대가 메뉴를 누르면 이 화면도 함께 이동합니다.</p><label>방문자 용건<textarea id="visitor_request" maxlength="2000"></textarea></label><label>소유자 답변<textarea id="owner_reply" maxlength="2000"></textarea></label><button id="save">내 입력 공유</button><p class="muted" id="sync"></p></section></div><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.hash.slice(1));let ws,rtc,stream,role,revision=0,roomId,token,menuIndex=0,menus=[];let callApproved=false,callRequested=false,pendingPurpose=null;const say=s=>$('#status').textContent=s;const callControls=()=>{$('#request_call').hidden=role!=='visitor'||callApproved;$('#approve_call').hidden=role!=='owner'||!callRequested;$('#decline_call').hidden=role!=='owner'||!callRequested;$('#call').disabled=!callApproved||!ws||ws.readyState!==1};const showMenu=i=>{menuIndex=i;$('#current').textContent=menus[i]||'메뉴';document.querySelectorAll('#menus button').forEach((b,j)=>b.classList.toggle('active',j===i))};const send=v=>{if(ws?.readyState===1)ws.send(JSON.stringify(v))};async function connect(id,r,t){roomId=id;role=r;token=t;$('#create').hidden=true;$('#room').hidden=false;$('#visitor_request').readOnly=role!=='visitor';$('#owner_reply').readOnly=role!=='owner';ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${encodeURIComponent(id)}`);ws.onopen=()=>send({type:'auth',role,token});ws.onclose=()=>{say('화면 연결 종료');$('#call').disabled=true;stopVoice()};ws.onmessage=async event=>{const v=JSON.parse(event.data);if(v.type==='snapshot'){revision=v.revision;menus=v.menus;$('#title').textContent=v.display_name;$('#intro').textContent=v.introduction;$('#menus').replaceChildren();for(const [i,title] of menus.entries()){const b=document.createElement('button');b.textContent=title;b.onclick=()=>{if(role==='visitor')pendingPurpose=title==='개인적인 통화'?'개인적인 통화를 요청합니다.':title;send({type:'menu',index:i})};$('#menus').append(b)}showMenu(v.menu_index);$('#visitor_request').value=v.fields.visitor_request;$('#owner_reply').value=v.fields.owner_reply;callApproved=v.call_approved;callRequested=v.call_requested;callControls();say(v.peer_present?'상대가 연결되었습니다':'상대를 기다립니다')}else if(v.type==='peer_joined'){say('상대가 연결되었습니다');callControls()}else if(v.type==='peer_left'){say('상대가 나갔습니다');$('#call').disabled=true;stopVoice()}else if(v.type==='menu'){revision=v.revision;showMenu(v.index);if(role==='visitor'&&v.by==='visitor'&&pendingPurpose){const value=pendingPurpose;pendingPurpose=null;$('#visitor_request').value=value;send({type:'field',key:'visitor_request',value,revision})}$('#sync').textContent=`${v.by==='owner'?'소유자':'방문자'}가 메뉴를 열었습니다`}else if(v.type==='field'){revision=v.revision;$('#'+v.key).value=v.value;if(role==='visitor'&&v.by==='visitor'&&v.key==='visitor_request'&&v.value==='개인적인 통화를 요청합니다.'){send({type:'request_call'});say('개인적인 통화를 요청했습니다. 소유자의 허용을 기다립니다')}$('#sync').textContent='입력 내용이 함께 저장됐습니다'}else if(v.type==='conflict'){revision=v.revision;$('#visitor_request').value=v.fields.visitor_request;$('#owner_reply').value=v.fields.owner_reply;$('#sync').textContent='동시 변경이 있어 최신 내용을 다시 불러왔습니다. 확인 후 다시 입력하세요.'}else if(v.type==='call_requested'){callRequested=true;callControls();say('통화 요청이 들어왔습니다. 소유자가 결정합니다')}else if(v.type==='call_decision'){callApproved=v.approved;callRequested=false;callControls();say(v.approved?'소유자가 통화를 허용했습니다':'소유자가 이번 통화를 거절했습니다');if(!v.approved)stopVoice();else if(role==='visitor')$('#call').click()}else if(v.type==='hangup'){stopVoice();say('상대가 음성 통화를 종료했습니다')}else if(v.type==='offer'||v.type==='answer'||v.type==='ice'){try{await signal(v)}catch(e){say('음성 연결 실패: '+e.message)}}}};
let pendingIce=[];async function prepareVoice(){if(rtc)return rtc;stream=await navigator.mediaDevices.getUserMedia({audio:true});const config=await fetch('/ice').then(r=>r.json());rtc=new RTCPeerConnection(config);stream.getTracks().forEach(track=>rtc.addTrack(track,stream));rtc.ontrack=e=>{$('#remote').srcObject=e.streams[0]};rtc.onicecandidate=e=>{if(e.candidate)send({type:'ice',value:e.candidate.toJSON()})};rtc.onconnectionstatechange=()=>say('음성 상태: '+rtc.connectionState);$('#hangup').disabled=false;return rtc}async function signal(v){if(v.type==='ice'){if(!rtc||!rtc.remoteDescription){pendingIce.push(v.value);return}await rtc.addIceCandidate(v.value);return}const pc=await prepareVoice();await pc.setRemoteDescription(v.value);for(const candidate of pendingIce.splice(0))await pc.addIceCandidate(candidate);if(v.type==='offer'){const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'answer',value:pc.localDescription.toJSON()})}}function stopVoice(){rtc?.close();rtc=null;pendingIce=[];stream?.getTracks().forEach(t=>t.stop());stream=null;$('#remote').srcObject=null;$('#hangup').disabled=true}$('#request_call').onclick=()=>{if(!$('#visitor_request').value.trim()){say('용건을 입력하고 내 입력 공유를 누른 뒤 요청하세요');return}send({type:'request_call'})};$('#approve_call').onclick=()=>send({type:'decide_call',approved:true});$('#decline_call').onclick=()=>send({type:'decide_call',approved:false});$('#call').onclick=async()=>{try{const pc=await prepareVoice(),offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',value:pc.localDescription.toJSON()})}catch(e){say('마이크를 열 수 없습니다: '+e.message);stopVoice()}};$('#hangup').onclick=()=>{send({type:'hangup'});stopVoice()};$('#save').onclick=()=>{const key=role==='owner'?'owner_reply':'visitor_request';send({type:'field',key,value:$('#'+key).value,revision})};$('#draft').onchange=async e=>{try{const draft=JSON.parse(await e.target.files[0].text());if(draft.schema_version!=='apf.call-template/1.0'||draft.publication_state!=='DRAFT'||typeof draft.display_name!=='string'||typeof draft.introduction!=='string'||!Array.isArray(draft.menus)||draft.menus.length<1||draft.menus.some(menu=>typeof menu.title!=='string'))throw new Error('아르카온 초안 형식이 아닙니다');const form=$('#new');form.elements.name.value=draft.display_name;form.elements.intro.value=draft.introduction;form.elements.menus.value=draft.menus.map(menu=>menu.title).join('\n');$('#created').textContent='초안을 가져왔습니다. 내용을 확인하고 통화방을 만드세요.'}catch(error){$('#created').textContent='초안 가져오기 실패: '+error.message}};$('#new').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target);const response=await fetch('/rooms',{method:'POST',headers:{'Content-Type':'application/json','X-Owner-Key':data.get('key')},body:JSON.stringify({display_name:data.get('name'),introduction:data.get('intro'),menu_titles:data.get('menus').split('\n').map(x=>x.trim()).filter(Boolean)})});const room=await response.json();if(!response.ok){$('#created').textContent=room.detail||'방 생성 실패';return}$('#created').textContent='방문자 링크를 복사해 상대에게 보내세요.';await navigator.clipboard?.writeText(room.visitor_url).catch(()=>{});location.hash=new URL(room.owner_url).hash;connect(room.room_id,'owner',new URL(room.owner_url).hash.split('token=')[1]);const share=document.createElement('input');share.value=room.visitor_url;share.readOnly=true;$('#room .panel').append(share)};if(params.has('room')&&params.has('token')&&['owner','visitor'].includes(params.get('role')))connect(params.get('room'),params.get('role'),params.get('token'));
</script></body></html>
