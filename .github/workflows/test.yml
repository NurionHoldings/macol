name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/macol-ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
      - run: node --check /tmp/macol-ui.js
