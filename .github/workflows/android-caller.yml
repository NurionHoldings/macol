name: Android caller pilot APK
on:
  pull_request:
    paths:
      - 'android-caller/**'
      - '.github/workflows/android-caller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build pilot APK
        working-directory: android-caller
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: macol-android-caller-debug
          path: android-caller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
